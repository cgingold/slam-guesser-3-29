<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎾 Slam Guesser Simple — Schedule Admin</title>

<style>
:root {
  --bg:          #e8edeb;
  --surface:     #ffffff;
  --surface-2:   #f4f5f1;
  --ink:         #1d3e35;
  --ink-soft:    #4a6e63;
  --ink-faint:   #94a8a0;
  --line:        #cfd4d0;
  --accent:      #a5e85a;
  --header-bg:   #1d3e35;
  --header-ink:  #ffffff;
  --warning-bg:  #fdf0d6;
  --warning-fg:  #92400e;
  --error-bg:    #fde2e0;
  --error-fg:    #8a1e10;
  --override-bg: #dde9f4;
  --override-fg: #1e3a8a;
  --past-bg:     #ededea;
  --past-fg:     #94a8a0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.header {
  background: var(--header-bg);
  color: var(--header-ink);
  padding: 14px 24px;
}

.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.brand {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 22px;
  font-weight: 600;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 24px 48px;
}

.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.toolbar .file-input {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
}

.stats {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-soft);
  margin-left: auto;
}

.stats b { color: var(--ink); }

button {
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--header-ink);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: filter 0.15s;
}

button:hover:not(:disabled) { filter: brightness(1.12); }
button.ghost { background: transparent; color: var(--ink); }
button.ghost:hover { background: rgba(29, 62, 53, 0.06); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.legend {
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--ink-soft);
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.legend-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  vertical-align: middle;
  margin-right: 4px;
  border: 1px solid var(--line);
}

table.schedule {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  font-size: 13px;
}

.schedule th, .schedule td {
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

.schedule th {
  background: var(--surface-2);
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.schedule tr:last-child td { border-bottom: none; }

.date-cell {
  white-space: nowrap;
  font-weight: 600;
  width: 1%;
}

.date-cell .weekday {
  color: var(--ink-faint);
  font-weight: 500;
  margin-right: 8px;
  display: inline-block;
  width: 32px;
}

.date-cell .iso {
  color: var(--ink-soft);
  font-weight: 500;
  margin-left: 6px;
  font-size: 11px;
}

.is-today .date-cell {
  background: linear-gradient(90deg, rgba(165, 232, 90, 0.35), transparent 60%);
}

.is-today .date-cell .iso::after {
  content: "TODAY";
  background: var(--accent);
  color: var(--ink);
  font-size: 9px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 999px;
  margin-left: 8px;
  letter-spacing: 0.05em;
}

.is-past td {
  background: var(--past-bg);
  color: var(--past-fg);
}

.player-cell {
  position: relative;
  cursor: pointer;
}

.player-cell.editable:hover {
  background: rgba(29, 62, 53, 0.04);
}

.player-cell.has-override .player-name {
  color: var(--override-fg);
  font-weight: 600;
}

.player-cell.has-override::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--override-fg);
}

.is-past .player-cell { cursor: not-allowed; }
.is-past .player-cell::before { display: none; }

.player-line {
  display: flex;
  align-items: center;
  gap: 4px;
}

.player-name {
  display: inline-block;
}

.warning-note {
  font-size: 11px;
  color: var(--warning-fg);
  margin-top: 2px;
  font-weight: 500;
  cursor: help;
}

.warning-note.is-error {
  color: var(--error-fg);
  font-weight: 700;
}

.is-past .warning-note {
  color: var(--past-fg);
}

/* Cells with a hard error get a red left-edge stripe so they're easy
   to scan for. Overrides take precedence — once the user overrides
   a cell, the error stripe goes away. */
.player-cell.has-error:not(.has-override) {
  background: rgba(138, 30, 16, 0.04);
}
.player-cell.has-error:not(.has-override)::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--error-fg);
}

.revert-btn {
  margin-left: 8px;
  background: transparent;
  border: none;
  color: var(--ink-faint);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  display: inline-block;
  line-height: 1;
  vertical-align: middle;
}

.revert-btn:hover { color: var(--warning-fg); filter: none; }

/* Inline editor */
.cell-editor {
  position: relative;
  width: 100%;
}

.cell-editor input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--ink-soft);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  background: var(--surface);
}

.suggestions {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  max-height: 360px;
  overflow-y: auto;
  z-index: 100;
  box-shadow: 0 6px 16px rgba(29, 62, 53, 0.15);
}

.suggestion {
  padding: 7px 11px;
  cursor: pointer;
  font-size: 13px;
}

.suggestion:hover, .suggestion.highlighted {
  background: rgba(29, 62, 53, 0.06);
}

.suggestion .nat {
  color: var(--ink-faint);
  font-size: 11px;
  margin-left: 6px;
}

/* Warning tooltip pattern via title attribute is plenty; no custom popover */

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: white;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 1000;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.empty {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  color: var(--ink-soft);
}

.warning-summary {
  background: var(--warning-bg);
  color: var(--warning-fg);
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 12px;
  display: none;
}

.warning-summary.show { display: block; }

.warning-summary.has-errors {
  background: var(--error-bg);
  color: var(--error-fg);
}

.warning-summary .sev-error { font-weight: 700; }
.warning-summary .sev-warn  { opacity: 0.85; }

@media (max-width: 720px) {
  .header { padding: 12px 16px; }
  .brand { font-size: 18px; }
  .app { padding: 20px 12px 40px; }
  .schedule th, .schedule td { padding: 6px 8px; font-size: 12px; }
  .date-cell .iso { display: none; }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">🎾 Schedule Admin (Simple)</div>
    <div class="header-actions">
      <button id="saveBtn" title="Download daily_overrides_simple.json">📥 Save JSON</button>
    </div>
  </div>
</header>

<div class="app">

  <div class="toolbar">
    <label class="file-input">
      📂 Load players.json
      <input type="file" id="playersFile" accept=".json" hidden>
    </label>
    <label class="file-input">
      📂 Load overrides.json
      <input type="file" id="overridesFile" accept=".json" hidden>
    </label>
    <button class="ghost" id="clearOverridesBtn">Clear All Overrides</button>

    <div class="stats">
      <span>Pool: <b id="standardCount">0</b> players</span>
      <span> | Overrides: <b id="overrideCount">0</b></span>
    </div>
  </div>

  <div class="legend">
    <span><span class="legend-swatch" style="background: #dde9f4; border-color: #1e3a8a"></span>Manual override</span>
    <span><span class="legend-swatch" style="background: var(--past-bg)"></span>Past (read-only)</span>
    <span><span class="legend-swatch" style="background: var(--error-bg); border-color: #f4a8a0"></span>🛑 Reused within ±14 days (fix required)</span>
    <span><span class="legend-swatch" style="background: var(--warning-bg); border-color: #f4cd84"></span>⚠ Reused within ±45 days</span>
  </div>

  <div class="warning-summary" id="warningSummary"></div>

  <div id="scheduleWrap">
    <div class="empty">Load <code>players.json</code> above to see the schedule.</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   CONSTANTS — keep in sync with the simple game's rotation logic
   ========================================================= */
const SHUFFLE_SEED = "slam-guesser-simple-v1";
const ROTATION_EPOCH = "2026-01-01";

const STORAGE_KEY = "slamGuesserSimple.scheduleAdmin.overrides.v1";

const VIEW_PAST_DAYS = 30;
const VIEW_FUTURE_DAYS = 30;
const WARN_WINDOW_DAYS = 45;  // ± this many days → orange warning
const ERROR_WINDOW_DAYS = 14; // ± this many days → red error (must fix)

// Conflicts before this date are ignored.
const CONFLICT_FLOOR = "2026-05-28";

const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MODES = ["standard"]; // single-mode build

/* =========================================================
   STATE
   ========================================================= */
let state = {
  players: [],
  pools: {},          // mode → filtered player array (eligible for that mode)
  rotations: {},      // mode → shuffled array (deterministic)
  overrides: loadOverrides(),  // { "YYYY-MM-DD": { mode: "Player Name" } }
  editingCell: null,  // {date, mode} when an inline editor is open
};

/* =========================================================
   ROTATION LOGIC — mirror of the game's pickRotationPlayer
   ========================================================= */
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  }
  return h;
}

function mulberry32(seedInt) {
  let a = seedInt >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffleStable(arr, seedStr) {
  const out = arr.slice();
  const rand = mulberry32(hashStr(seedStr));
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function daysBetween(a, b) {
  const [ay, am, ad] = a.split("-").map(Number);
  const [by, bm, bd] = b.split("-").map(Number);
  const da = Date.UTC(ay, am - 1, ad);
  const db = Date.UTC(by, bm - 1, bd);
  return Math.round((db - da) / 86400000);
}

function mod(n, m) { return ((n % m) + m) % m; }

function pickRotationPlayer(mode, dateIso) {
  const order = state.rotations[mode];
  if (!order || order.length === 0) return null;
  const i = mod(daysBetween(ROTATION_EPOCH, dateIso), order.length);
  return order[i];
}

/* =========================================================
   POOL FILTERS — must match game's filter logic exactly
   ========================================================= */
function reachedQFplus(p) {
  const deep = new Set(["QF", "SF", "F", "W"]);
  const slams = p.slams || {};
  for (const t of Object.values(slams)) {
    for (const r of Object.values(t)) if (deep.has(r)) return true;
  }
  return false;
}

function buildPools(players) {
  state.pools = {
    standard: players.filter(reachedQFplus),
  };
  state.rotations = {};
  for (const m of MODES) {
    state.rotations[m] = shuffleStable(state.pools[m], `${SHUFFLE_SEED}:${m}`);
  }
  document.getElementById("standardCount").textContent = state.pools.standard.length;
}

/* =========================================================
   OVERRIDES — persisted to localStorage for in-progress edits
   ========================================================= */
function loadOverrides() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveOverridesLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.overrides)); }
  catch {}
}

function setOverride(date, mode, name) {
  if (!state.overrides[date]) state.overrides[date] = {};
  state.overrides[date][mode] = name;
  saveOverridesLocal();
  updateOverrideCount();
}

function clearOverride(date, mode) {
  if (state.overrides[date]) {
    delete state.overrides[date][mode];
    if (Object.keys(state.overrides[date]).length === 0) {
      delete state.overrides[date];
    }
  }
  saveOverridesLocal();
  updateOverrideCount();
}

function getOverride(date, mode) {
  return state.overrides[date]?.[mode] || null;
}

function updateOverrideCount() {
  let n = 0;
  for (const day of Object.values(state.overrides)) n += Object.keys(day).length;
  document.getElementById("overrideCount").textContent = n;
}

/* =========================================================
   DATE HELPERS
   ========================================================= */
function todayLocal() {
  const d = new Date();
  return isoOf(d);
}

function isoOf(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function addDays(dateIso, n) {
  const [y, m, d] = dateIso.split("-").map(Number);
  const dt = new Date(y, m - 1, d + n);
  return isoOf(dt);
}

function weekdayOf(dateIso) {
  const [y, m, d] = dateIso.split("-").map(Number);
  return WEEKDAYS[new Date(y, m - 1, d).getDay()];
}

function isPast(dateIso) {
  return dateIso < todayLocal();
}

/* =========================================================
   EFFECTIVE SCHEDULE — auto-pick with overrides applied
   ========================================================= */
function effectivePlayerName(date, mode) {
  const override = getOverride(date, mode);
  if (override) return override;
  const p = pickRotationPlayer(mode, date);
  return p ? p.name : "?";
}

/* =========================================================
   WARNING DETECTION — name reused in any mode ±WARN_WINDOW_DAYS
   ========================================================= */
function findReuseWarnings(visibleDates) {
  // Build a name → list of (date, mode) occurrences across the full
  // ±WARN_WINDOW_DAYS window for every visible date. Returns a map:
  //   { "YYYY-MM-DD::mode": "warning message" }
  const minDate = addDays(visibleDates[0], -WARN_WINDOW_DAYS);
  const maxDate = addDays(visibleDates[visibleDates.length - 1], WARN_WINDOW_DAYS);

  // Walk every date in [minDate, maxDate] and record the effective name
  // for each mode at that date. Dates before CONFLICT_FLOOR are skipped
  // so that pre-rotation history doesn't generate spurious warnings.
  const occurrences = new Map(); // name → [{date, mode}, ...]
  const floor = CONFLICT_FLOOR;
  let cursor = minDate;
  while (cursor <= maxDate) {
    if (cursor >= floor) {
      for (const m of MODES) {
        const name = effectivePlayerName(cursor, m);
        if (!occurrences.has(name)) occurrences.set(name, []);
        occurrences.get(name).push({ date: cursor, mode: m });
      }
    }
    cursor = addDays(cursor, 1);
  }

  // For each visible cell, build a warning if its name appears anywhere
  // else within ±WARN_WINDOW_DAYS (excluding the cell itself).
  // Returns { "date::mode": { summary, full, count } } so the renderer
  // can show an inline summary AND a tooltip with the full list.
  // Cells before CONFLICT_FLOOR aren't scored — pre-rotation history.
  const warnings = {};
  for (const date of visibleDates) {
    if (date < floor) continue;
    for (const m of MODES) {
      const name = effectivePlayerName(date, m);
      const all = occurrences.get(name) || [];
      const nearby = all
        .filter(o =>
          !(o.date === date && o.mode === m) &&
          Math.abs(daysBetween(date, o.date)) <= WARN_WINDOW_DAYS
        )
        // Sort by closeness to the current date so the "closest" is index 0.
        .sort((a, b) =>
          Math.abs(daysBetween(date, a.date)) -
          Math.abs(daysBetween(date, b.date))
        );
      if (nearby.length > 0) {
        const closest = nearby[0];
        const dDist = daysBetween(date, closest.date); // negative = past, positive = future
        const closestAbs = Math.abs(dDist);
        const severity = closestAbs <= ERROR_WINDOW_DAYS ? "error" : "warning";
        warnings[`${date}::${m}`] = {
          severity,
          summary: formatClosestWarning(closest, dDist, nearby.length),
          full: nearby.map(o => {
            const dd = daysBetween(date, o.date);
            return `${o.date} (${formatRelative(dd)})`;
          }).join(" · "),
          count: nearby.length,
        };
      }
    }
  }
  return warnings;
}

function capMode(m) {
  return m.charAt(0).toUpperCase() + m.slice(1);
}

function formatRelative(dDist) {
  if (dDist === 0) return "same day";
  const n = Math.abs(dDist);
  const unit = n === 1 ? "day" : "days";
  return dDist < 0 ? `${n} ${unit} ago` : `in ${n} ${unit}`;
}

function formatClosestWarning(closest, dDist, totalCount) {
  const more = totalCount > 1 ? ` +${totalCount - 1} more` : "";
  return `Also ${formatRelative(dDist)}${more}`;
}

/* =========================================================
   AUTOCOMPLETE EDITOR
   ========================================================= */
function openEditor(date, mode, cellEl) {
  if (isPast(date)) return;
  closeEditor();

  state.editingCell = { date, mode };
  const pool = state.pools[mode];
  const currentName = effectivePlayerName(date, mode);

  cellEl.innerHTML = `
    <div class="cell-editor">
      <input type="text" id="cellInput"
             placeholder="Type to search ${pool.length} ${mode} players..."
             value="" />
      <div class="suggestions" id="cellSuggestions"></div>
    </div>
  `;
  const input = cellEl.querySelector("#cellInput");
  const sugg  = cellEl.querySelector("#cellSuggestions");

  let highlighted = 0;
  let visibleMatches = [];

  function renderSuggestions(query) {
    const q = query.trim().toLowerCase();
    const list = q.length === 0
      ? pool.slice(0, 50)
      : pool.filter(p => p.name.toLowerCase().includes(q)).slice(0, 100);
    visibleMatches = list;
    if (list.length === 0) {
      sugg.innerHTML = `<div class="suggestion" style="color:var(--ink-faint)">No matches</div>`;
      return;
    }
    sugg.innerHTML = list.map((p, i) => `
      <div class="suggestion ${i === highlighted ? "highlighted" : ""}" data-i="${i}">
        ${p.name} <span class="nat">${p.nationality || ""}</span>
      </div>
    `).join("");
    sugg.querySelectorAll(".suggestion").forEach(el => {
      el.addEventListener("mousedown", e => {  // mousedown beats blur
        e.preventDefault();
        const i = parseInt(el.dataset.i, 10);
        commit(visibleMatches[i].name);
      });
    });

    // Position the fixed dropdown relative to the input. Prefer below;
    // flip above when there isn't room (e.g., bottom of the viewport).
    positionDropdown();

    // Keep the highlighted row in view as the user arrows up/down.
    const hi = sugg.querySelector(".suggestion.highlighted");
    if (hi) hi.scrollIntoView({ block: "nearest" });
  }

  function positionDropdown() {
    const inputRect = input.getBoundingClientRect();
    const vh = window.innerHeight;
    const DROPDOWN_MAX = 360;
    const GAP = 4;

    sugg.style.left  = `${inputRect.left}px`;
    sugg.style.width = `${inputRect.width}px`;

    const spaceBelow = vh - inputRect.bottom;
    const spaceAbove = inputRect.top;

    if (spaceBelow >= DROPDOWN_MAX || spaceBelow >= spaceAbove) {
      // Place below
      sugg.style.top = `${inputRect.bottom + GAP}px`;
      sugg.style.bottom = "auto";
      sugg.style.maxHeight = `${Math.min(DROPDOWN_MAX, spaceBelow - GAP - 8)}px`;
    } else {
      // Flip above
      sugg.style.top = "auto";
      sugg.style.bottom = `${vh - inputRect.top + GAP}px`;
      sugg.style.maxHeight = `${Math.min(DROPDOWN_MAX, spaceAbove - GAP - 8)}px`;
    }
  }

  function commit(name) {
    // If user picked the same as the auto-pick, treat that as clearing
    // the override (cleaner). Otherwise set it.
    const autoPick = pickRotationPlayer(mode, date);
    if (autoPick && autoPick.name === name) {
      clearOverride(date, mode);
    } else {
      setOverride(date, mode, name);
    }
    closeEditor();
    renderSchedule();
  }

  input.addEventListener("input", () => {
    highlighted = 0;
    renderSuggestions(input.value);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") {
      highlighted = Math.min(highlighted + 1, visibleMatches.length - 1);
      renderSuggestions(input.value);
      e.preventDefault();
    } else if (e.key === "ArrowUp") {
      highlighted = Math.max(highlighted - 1, 0);
      renderSuggestions(input.value);
      e.preventDefault();
    } else if (e.key === "Enter") {
      if (visibleMatches[highlighted]) {
        commit(visibleMatches[highlighted].name);
      }
      e.preventDefault();
    } else if (e.key === "Escape") {
      closeEditor();
      renderSchedule();
      e.preventDefault();
    }
  });

  input.addEventListener("blur", () => {
    // Small delay so click on suggestion fires first (handled via mousedown above too)
    setTimeout(() => {
      if (state.editingCell) {
        closeEditor();
        renderSchedule();
      }
    }, 120);
  });

  // If the user scrolls the page, the dropdown (position: fixed) would
  // detach from the input. Close it to avoid the floating-orphan feel.
  // Resize also invalidates positioning, so close on that too.
  // We use capture: true to catch scroll events on any container, but
  // skip events that originated inside the dropdown (arrow-key
  // scrollIntoView triggers those).
  function onScrollOrResize(e) {
    if (e && e.type === "scroll" && sugg && sugg.contains(e.target)) return;
    if (state.editingCell) {
      closeEditor();
      renderSchedule();
    }
  }
  state.editorCleanup = () => {
    window.removeEventListener("scroll", onScrollOrResize, true);
    window.removeEventListener("resize", onScrollOrResize);
  };
  window.addEventListener("scroll", onScrollOrResize, true);
  window.addEventListener("resize", onScrollOrResize);

  input.focus();
  renderSuggestions("");
}

function closeEditor() {
  state.editingCell = null;
  if (state.editorCleanup) {
    state.editorCleanup();
    state.editorCleanup = null;
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function visibleDateRange() {
  const today = todayLocal();
  const dates = [];
  for (let i = -VIEW_PAST_DAYS; i <= VIEW_FUTURE_DAYS; i++) {
    dates.push(addDays(today, i));
  }
  return dates;
}

function renderSchedule() {
  if (state.players.length === 0) return;

  const dates = visibleDateRange();
  const warnings = findReuseWarnings(dates);

  // Severity summary — split errors vs warnings
  const errCount  = Object.values(warnings).filter(w => w.severity === "error").length;
  const warnCount = Object.values(warnings).filter(w => w.severity === "warning").length;
  const sumEl = document.getElementById("warningSummary");
  if (errCount > 0 || warnCount > 0) {
    const parts = [];
    if (errCount > 0) {
      parts.push(`<span class="sev-error">🛑 ${errCount} error${errCount === 1 ? "" : "s"} (within ±${ERROR_WINDOW_DAYS} days — must fix)</span>`);
    }
    if (warnCount > 0) {
      parts.push(`<span class="sev-warn">⚠ ${warnCount} warning${warnCount === 1 ? "" : "s"} (within ±${WARN_WINDOW_DAYS} days)</span>`);
    }
    sumEl.innerHTML = parts.join(" · ") + ". Hover any cell for the full list.";
    sumEl.classList.add("show");
    sumEl.classList.toggle("has-errors", errCount > 0);
  } else {
    sumEl.classList.remove("show");
    sumEl.classList.remove("has-errors");
  }

  const today = todayLocal();
  const rows = dates.map(d => {
    const past = isPast(d);
    const isToday = d === today;
    const rowClass = [
      past ? "is-past" : "",
      isToday ? "is-today" : "",
    ].filter(Boolean).join(" ");

    const cells = MODES.map(m => {
      const name = effectivePlayerName(d, m);
      const isOverride = !!getOverride(d, m);
      const warning = warnings[`${d}::${m}`];
      const severity = warning?.severity || null;
      const classes = [
        "player-cell",
        past ? "" : "editable",
        isOverride ? "has-override" : "",
        severity === "error"   ? "has-error" : "",
        severity === "warning" ? "has-warning" : "",
      ].filter(Boolean).join(" ");
      const title = warning ? `title="${escapeHtml(warning.full)}"` : "";
      const revertBtn = (isOverride && !past)
        ? `<button class="revert-btn" data-revert="${d}|${m}" title="Reset to auto-pick">×</button>`
        : "";
      const icon = severity === "error" ? "🛑" : "⚠";
      const noteClass = severity === "error" ? "warning-note is-error" : "warning-note";
      const warningNote = warning
        ? `<div class="${noteClass}">${icon} ${escapeHtml(warning.summary)}</div>`
        : "";
      return `
        <td class="${classes}" data-date="${d}" data-mode="${m}" ${title}>
          <div class="player-line">
            <span class="player-name">${escapeHtml(name)}</span>${revertBtn}
          </div>
          ${warningNote}
        </td>
      `;
    }).join("");

    return `
      <tr class="${rowClass}">
        <td class="date-cell">
          <span class="weekday">${weekdayOf(d)}</span>
          <span class="iso">${d}</span>
        </td>
        ${cells}
      </tr>
    `;
  }).join("");

  document.getElementById("scheduleWrap").innerHTML = `
    <table class="schedule">
      <thead>
        <tr>
          <th>Date</th>
          <th>Player</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  // Wire cell click → open editor
  document.querySelectorAll(".player-cell.editable").forEach(td => {
    td.addEventListener("click", e => {
      if (e.target.classList.contains("revert-btn")) return;
      openEditor(td.dataset.date, td.dataset.mode, td);
    });
  });

  // Wire revert buttons
  document.querySelectorAll(".revert-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const [date, mode] = btn.dataset.revert.split("|");
      clearOverride(date, mode);
      renderSchedule();
    });
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* =========================================================
   SAVE / LOAD JSON
   ========================================================= */
function downloadOverrides() {
  // Hard-error guard: if there are conflicts within the error window,
  // prompt before allowing the user to save. They can override the warning
  // (in case they're doing an incremental save), but it's noisy on purpose.
  const dates = visibleDateRange();
  const warnings = findReuseWarnings(dates);
  const errs = Object.values(warnings).filter(w => w.severity === "error").length;
  if (errs > 0) {
    const ok = confirm(
      `There are ${errs} unresolved error${errs === 1 ? "" : "s"} ` +
      `(player conflicts within ±${ERROR_WINDOW_DAYS} days). ` +
      `Save the JSON anyway?`
    );
    if (!ok) return;
  }

  const blob = new Blob(
    [JSON.stringify({ overrides: state.overrides }, null, 2)],
    { type: "application/json" }
  );
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "daily_overrides_simple.json";
  a.click();
  showToast("📥 Downloaded daily_overrides_simple.json");
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}

/* =========================================================
   FILE INPUTS
   ========================================================= */
document.getElementById("playersFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error("Expected array of players");
    state.players = data;
    buildPools(data);
    renderSchedule();
    showToast(`✓ Loaded ${data.length} players`);
  } catch (err) {
    showToast(`✗ ${err.message}`);
  }
  e.target.value = "";
});

document.getElementById("overridesFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const next = data.overrides || data;
    if (typeof next !== "object" || Array.isArray(next)) {
      throw new Error("Expected {overrides: {...}} or {date: {mode: name}, ...}");
    }
    state.overrides = next;
    saveOverridesLocal();
    updateOverrideCount();
    renderSchedule();
    showToast(`✓ Loaded overrides`);
  } catch (err) {
    showToast(`✗ ${err.message}`);
  }
  e.target.value = "";
});

document.getElementById("clearOverridesBtn").addEventListener("click", () => {
  if (!confirm("Clear all manual overrides? (Past dates included.)")) return;
  state.overrides = {};
  saveOverridesLocal();
  updateOverrideCount();
  renderSchedule();
  showToast("Cleared all overrides");
});

document.getElementById("saveBtn").addEventListener("click", downloadOverrides);

/* =========================================================
   AUTO-LOAD players.json from same directory if available
   ========================================================= */
async function tryAutoLoadPlayers() {
  try {
    const res = await fetch("./players_328.json");
    if (!res.ok) return;
    const data = await res.json();
    state.players = data;
    buildPools(data);
    renderSchedule();
    showToast(`✓ Auto-loaded ${data.length} players`);
  } catch {
    // No file — that's fine, user can load manually
  }
}

updateOverrideCount();
tryAutoLoadPlayers();

</script>
