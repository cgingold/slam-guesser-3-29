<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎾 Slam Guesser</title>

<style>

body {
  margin:0;
  padding:20px;
  background:#1e483c;
  color:white;
  font-family:Arial;
}

h1 {
  text-align:center;
}

.top {
  display:flex;
  justify-content:center;
  gap:20px;
  margin:10px 0;
  flex-wrap:wrap;
}

.box {
  background:#1e293b;
  padding:10px 15px;
  border-radius:10px;
  /* WRONG COUNTER STATES */
}
.box.wrong-1 {
  background: #e87878 !important; /* light red */
}

.box.wrong-2 {
  background: #b91c1c !important; /* medium red */
}

.box.wrong-3 {
  background: #7f0000 !important; /* dark red */
}

/* MODES */
.play-toggle {
  display:flex;
  justify-content:center;
  margin:10px 0;
  background:#111827;
  border:1px solid #334155;
  border-radius:14px;
  overflow:hidden;
  width:fit-content;
  margin-left:auto;
  margin-right:auto;
}

.play-btn {
  background:transparent;
  border:none;
  color:#94a3b8;
  padding:10px 18px;
  font-weight:bold;
  cursor:pointer;
}

.play-btn.active {
  background:#7c3aed;
  color:white;
}
.play-btn[data-play="practice"].active {
  background:#eab308;
  color:black;
}

.mode-toggle {
  display:flex;
  justify-content:center;
  margin:15px 0;
  background:#111827;
  border:1px solid #334155;
  border-radius:14px;
  overflow:hidden;
  width:fit-content;
  margin-left:auto;
  margin-right:auto;
}

.mode-btn {
  background:transparent;
  border:none;
  color:#94a3b8;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.mode-btn:hover {
  background:#1e293b;
}

.mode-btn.active {
  color:white;
}

/* STANDARD = BLUE */

.mode-btn[data-mode="standard"].active {
  background:#2563eb;
}

/* WINNERS = GREEN */

.mode-btn[data-mode="winners"].active {
  background:#16a34a;
}

/* HARD = ORANGE */

.mode-btn[data-mode="hard"].active {
  background:#ea580c;
}

/* CONTROLS */

.controls {
  display:flex;
  justify-content:center;
  gap:10px;
  margin:15px 0;
  flex-wrap:wrap;
  position:relative;
}

input {
  padding:10px;
  border-radius:8px;
  border:none;
  width:250px;
  font-size:14px;
}

button {
  padding:10px 14px;
  border-radius:8px;
  border:none;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled {
  background:#334155;
  cursor:not-allowed;
}

#giveUpBtn {
  background:#dc2626;
}

/* AUTOCOMPLETE */

.suggestions {
  position:absolute;
  top:45px;
  width:250px;
  background:#111827;
  border:1px solid #334155;
  border-radius:8px;
  max-height:250px;
  overflow-y:auto;
  z-index:10;
}

.suggestion {
  padding:8px;
  cursor:pointer;
}

.suggestion:hover {
  background:#1e293b;
}

/* HINT PANEL */

#hintPanel {
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px;
  flex-wrap:wrap;
}

/* HINT CARDS */

.hint-card {
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:bold;
  opacity:0;
  transform:translateY(10px);
  animation:fadeIn 0.25s forwards;
}

@keyframes fadeIn {
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.gender-card {
  background:#7c3aed;
}

.nation-card {
  background:#16a34a;
}

.answer-card {
  background:#ef4444;
}

.invalid-card {
  background:#b45309;
}

/* TABLE */

.table-wrap {
  overflow-x:auto;
  background:#111827;
  border-radius:10px;
  border:1px solid #334155;
  max-height:65vh;
}

table {
  border-collapse:collapse;
  width:100%;
  min-width:900px;
}

th, td {
  border:1px solid #334155;
  padding:5px;
  font-size:11px;
  text-align:center;
}

th {
  background:#1e293b;
  position:sticky;
  top:0;
}

.slam {
  background:#172554;
  position:sticky;
  left:0;
  font-weight:bold;
}

/* LEGEND */

.legend {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin:12px 0 12px;
  font-size:12px;
}

.legend-item {
  padding:4px 8px;
  border-radius:6px;
  font-weight:bold;
  min-width:34px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.15);
}

.legend-label {
  color:#cbd5e1;
  margin-right:10px;
}

/* RESULTS */


.W { background:#16a34a; }
.F { background:#c084fc; color:black; }
.SF { background:#fde047; color:black; }
.QF { background:#fdba74; color:black; }

.R1, .R2, .R3, .R4 {
  background:#3b82f6;
  color:white;
}

.Q1, .Q2, .Q3, .Q {
  background:#93c5fd;
  color:black;
}

.A { background:#6b7280; }
.NH { background:#0f766e; }

</style>
</head>

<body>

<h1>Slam Guesser🎾</h1>

<div class="play-toggle">

  <button class="play-btn"
          data-play="daily"
          onclick="setPlayType('daily')">
    Daily
  </button>

  <button class="play-btn"
          data-play="practice"
          onclick="setPlayType('practice')">
    Practice
  </button>

</div>

<div class="mode-toggle">

  <button class="mode-btn active"
          data-mode="standard"
          onclick="setMode('standard')">
    Standard
  </button>

  <button class="mode-btn"
          data-mode="winners"
          title="Slam Winners Only"
          onclick="setMode('winners')">
    Winners Only
  </button>

<button class="mode-btn"
        data-mode="hard"
        title="Years Removed"
        onclick="setMode('hard')">
  Hard Mode
</button>


</div>

<div class="top">

  <div class="box">
    Guesses:
    <span id="wrong">0</span>/3
  </div>

</div>

<div class="controls">

  <input id="guess" placeholder="Guess player..." autocomplete="off"/>

  <div id="suggestions" class="suggestions" style="display:none"></div>

  <button id="guessBtn" onclick="guess()">Guess</button>
  <button id="giveUpBtn" onclick="giveUp()">Give Up</button>
  <button id="nextBtn" onclick="next()" disabled>Next</button>
  <button id="shareBtn" onclick="share()" disabled>Share</button>
  
</div>

<div id="hintPanel"></div>

<div class="table-wrap">
  <table id="table"></table>
</div>

<div class="legend">

  <div class="legend-item W">W</div>
  <div class="legend-label">Winner</div>

  <div class="legend-item F">F</div>
  <div class="legend-label">Final</div>

  <div class="legend-item SF">SF</div>
  <div class="legend-label">Semifinal</div>

  <div class="legend-item QF">QF</div>
  <div class="legend-label">Quarterfinal</div>

  <div class="legend-item R1">R1-R4</div>
  <div class="legend-label">Rounds</div>

  <div class="legend-item Q">Q</div>
  <div class="legend-label">Qualifying</div>

  <div class="legend-item A">A</div>
  <div class="legend-label">Absent</div>

  <div class="legend-item NH">NH</div>
  <div class="legend-label">Not Held</div>

</div>

<script>

let game = {
  players: [],
  guessPool: [],
  current: null,
  previous: null,
  streak: 0,
  wrong: 0,
  locked: false,
  selectedSuggestion: false,
  suggestionIndex: -1,
  suggestionItems: [],
  lockProgressHints: false,
  roundHistory: [],
  currentRoundResult: null,
  day: 0,
  lastOutcome: null,

  // NEW
  mode: "standard",

// NEW
playType: "daily", // daily | archive | practice
date: null,
};
/* HIGHLIGHT HELPERS */

function highlightModeButtons() {
  document
    .querySelectorAll(".mode-btn")
    .forEach(btn => {
      btn.classList.toggle(
        "active",
        btn.dataset.mode === game.mode
      );
    });
}

function highlightPlayButtons() {
  document
    .querySelectorAll(".play-btn")
    .forEach(btn => {
      btn.classList.toggle(
        "active",
        btn.dataset.play === game.playType
      );
    });
}

/* URL SYNC (no reload) */

function syncURL() {

  const params =
    new URLSearchParams(window.location.search);

  params.set("play", game.playType);
  params.set("mode", game.mode);

  // only meaningful for daily/archive
  if (
    game.playType !== "practice" &&
    game.date
  ) {
    params.set("date", game.date);
  } else {
    params.delete("date");
  }

  history.replaceState(
    null,
    "",
    `?${params.toString()}`
  );
}

/* SEED REBUILD */

function rebuildSeed() {

  if (
    game.playType === "daily" ||
    game.playType === "archive"
  ) {
    game.seed = `${game.mode}-${game.date}`;
  } else {
    // practice — fresh random each time
    game.seed =
      Math.random()
        .toString(36)
        .substring(2, 10);
  }
}

/* MODE SWITCH */

function setMode(mode) {

  if (mode === game.mode) return; // no-op

  game.mode = mode;

  highlightModeButtons();
  syncURL();
  rebuildSeed();

  // start a fresh round in the new mode
  next();
}

/* PLAY TYPE SWITCH */

function setPlayType(playType) {

  if (playType === game.playType) return; // no-op

  game.playType = playType;

  highlightPlayButtons();
  syncURL();
  rebuildSeed();

  // start a fresh round in the new play type
  next();
}


/* DAILY PUZZLE SYSTEM */

/* PLAY TYPE */

function getPlayType() {

  const params =
    new URLSearchParams(window.location.search);

  return params.get("play") || "daily";
}

/* MODE */

function getMode() {

  const params =
    new URLSearchParams(window.location.search);

  const mode = params.get("mode");

  if (
    mode === "standard" ||
    mode === "winners" ||
    mode === "hard"
  ) {
    return mode;
  }

  return "standard";
}

/* TODAY */

function getTodayString() {

  const now = new Date();

  return now.toISOString().split("T")[0];
}

/* DATE */

function getRequestedDate() {

  const params =
    new URLSearchParams(window.location.search);

  const date =
    params.get("date");

  const today =
    getTodayString();

  // no date = today
  if (!date) {
    return today;
  }

  // prevent future dates
  if (date > today) {
    return today;
  }

  return date;
}

/* LOAD */

async function load() {

  const res =
    await fetch("./players_326.json");

  game.players =
    await res.json();

  const res2 =
    await fetch("./guess_pool_326.json");

  game.guessPool =
    await res2.json();

  // URL STATE
  game.playType = getPlayType();
  game.mode = getMode();
  game.date = getRequestedDate();

  highlightModeButtons();
  highlightPlayButtons();

  rebuildSeed();

  next();
}

/* RESET HINTS */

function clearHints() {
  document.getElementById("hintPanel").innerHTML = "";
}

/* MESSAGE */

function showMessage(text){

  const panel =
    document.getElementById("hintPanel");

  const div =
    document.createElement("div");

  div.className =
    "hint-card invalid-card";

  div.textContent = text;

  panel.appendChild(div);

  setTimeout(() => div.remove(), 2000);
}

/* FLAGS */

function nationalityToFlag(nation) {

  const map = {
    "Australia":"🇦🇺","Austria":"🇦🇹","Argentina":"🇦🇷","Belarus":"🇧🇾",
    "Belgium":"🇧🇪","Brazil":"🇧🇷","Bulgaria":"🇧🇬","Canada":"🇨🇦",
    "Chile":"🇨🇱","China":"🇨🇳","Croatia":"🇭🇷","Czech Republic":"🇨🇿",
    "Denmark":"🇩🇰","Estonia":"🇪🇪","Finland":"🇫🇮","France":"🇫🇷",
    "Germany":"🇩🇪","Greece":"🇬🇷","Hungary":"🇭🇺","India":"🇮🇳",
    "Italy":"🇮🇹","Japan":"🇯🇵","Kazakhstan":"🇰🇿","Latvia":"🇱🇻",
    "Mexico":"🇲🇽","Netherlands":"🇳🇱","New Zealand":"🇳🇿","Norway":"🇳🇴",
    "Poland":"🇵🇱","Portugal":"🇵🇹","Romania":"🇷🇴","Russia":"🇷🇺",
    "Serbia":"🇷🇸","Slovakia":"🇸🇰","Slovenia":"🇸🇮","South Africa":"🇿🇦",
    "South Korea":"🇰🇷","Spain":"🇪🇸","Sweden":"🇸🇪","Switzerland":"🇨🇭",
    "Tunisia":"🇹🇳","Turkey":"🇹🇷","Ukraine":"🇺🇦","United Kingdom":"🇬🇧",
    "United States":"🇺🇸","USA":"🇺🇸","US":"🇺🇸"
  };

  return map[nation] || "";
}

/* SEEDING */

function seededRandom(seed) {

  let x =
    Math.sin(
      seed.length * 999 +
      seed.charCodeAt(0)
    ) * 10000;

  return function () {

    x = Math.sin(x) * 10000;

    return x - Math.floor(x);
  };
}

/* NEXT PLAYER */


function next() {


// practice mode gets fresh random seed every round
if (game.playType === "practice") {

  game.seed =
    Math.random()
      .toString(36)
      .substring(2, 10);
}
 const rand =
  seededRandom(game.seed);
   
  game.wrong = 0;
  game.locked = false;
  game.selectedSuggestion = false;
  game.hintLocked = false;
  game.lockProgressHints = false;

const nextBtn =
  document.getElementById("nextBtn");

const shareBtn =
  document.getElementById("shareBtn");

nextBtn.style.display =
  game.playType === "practice"
    ? "inline-block"
    : "none";

shareBtn.style.display =
  game.playType === "practice"
    ? "none"
    : "inline-block";

shareBtn.disabled = true;

game.lastOutcome = null;

document.getElementById("guessBtn").disabled = false;
document.getElementById("giveUpBtn").disabled = false;

nextBtn.disabled = true;
nextBtn.style.outline = "none";

  document.getElementById("guess").value = "";

  hideSuggestions();
  clearHints();

 let eligiblePlayers = game.players;
 
 // STANDARD MODE FILTER
if (game.mode === "standard") {

  eligiblePlayers =
    eligiblePlayers.filter(player => {

      const slams = player.slams || {};

      let hasDeepOrMidRun = false;

      for (const tournament of Object.values(slams)) {
        for (const result of Object.values(tournament)) {

          if (
            result === "4R" ||
            result === "QF" ||
            result === "SF" ||
            result === "F" ||
            result === "W"
          ) {
            hasDeepOrMidRun = true;
            break;
          }
        }
        if (hasDeepOrMidRun) break;
      }

      return hasDeepOrMidRun;
    });
}

// WINNERS ONLY MODE
if (game.mode === "winners") {

  eligiblePlayers =
    game.players.filter(player => {

      const slams = player.slams || {};

      return Object.values(slams).some(years =>
        Object.values(years).includes("W")
      );
    });
}

// HARD MODE FILTER
if (game.mode === "hard") {

  eligiblePlayers =
    eligiblePlayers.filter(player => {

      const slams = player.slams || {};

      let hasDeepRun = false;

      for (const tournament of Object.values(slams)) {
        for (const result of Object.values(tournament)) {

          if (
            result === "SF" ||
            result === "F" ||
            result === "W"
          ) {
            hasDeepRun = true;
            break;
          }
        }
        if (hasDeepRun) break;
      }

      return hasDeepRun;
    });
}

// SAFETY CHECK
if (!eligiblePlayers.length) {
  showMessage("No eligible players for this mode");
  return;
}

let p;

// practice mode = true random
if (game.playType === "practice") {

  do {

    p = eligiblePlayers[
      Math.floor(
        Math.random() * eligiblePlayers.length
      )
    ];

  } while (
    eligiblePlayers.length > 1 &&
    p?.name === game.previous
  );
}

// daily/archive = deterministic
else {

  do {

    p = eligiblePlayers[
      Math.floor(
        rand() * eligiblePlayers.length
      )
    ];

  } while (
    eligiblePlayers.length > 1 &&
    p?.name === game.previous
  );
}
  game.current = p;
  game.previous = p.name;

  render();
  updateUI();
}

/* GUESS */

function guess() {

  if (game.locked) return;

  const input = document.getElementById("guess");
  const val = input.value.trim();

  if(!val){
    showMessage("⚠️ Please select a player");
    return;
  }

  if(!game.selectedSuggestion){
    showMessage("⚠️ Choose a player from the dropdown");
    return;
  }

  const target = game.current.name.toLowerCase();
  const guessLower = val.toLowerCase();

  const ok =
    guessLower === target ||
    guessLower === target.split(" ").pop();

  if (ok) {
  game.streak++;
  game.lastOutcome = ("win")
  game.lockProgressHints = true; // only block gender/nation hints

  showHints(true);

  endRound();
} else {
    game.wrong++;
    showHints(false);

    if (game.wrong >= 3) {
  game.streak = 0;
  game.lastOutcome = ("lose");
  endRound();
}

    updateUI();
  }

  hideSuggestions();
}

/* GIVE UP */

function giveUp() {

  if (game.locked) return;

  game.streak = 0;
  game.lastOutcome = ("lose");

  const panel = document.getElementById("hintPanel");

  const a = document.createElement("div");
  a.className = "hint-card answer-card";
  a.textContent = `🏳️ Gave Up: ${game.current.name}`;

  panel.appendChild(a);

  endRound();
}

// "win" or "lose"
function setOutcome(type) {
  game.lastOutcome = type; // "win" or "lose"
}


/* HINTS */

function showHints(correct) {

  const panel = document.getElementById("hintPanel");

  // ❌ only block progressive hints (gender/nation)
  if (!game.lockProgressHints) {

    if (game.wrong === 1) {
      const g = document.createElement("div");
      g.className = "hint-card gender-card";
      g.textContent = `👤 Gender: ${game.current.gender}`;
      panel.appendChild(g);
    }

    if (game.wrong === 2) {
      const n = document.createElement("div");
      n.className = "hint-card nation-card";

      const flag = nationalityToFlag(game.current.nationality);

      n.textContent = `${flag} ${game.current.nationality}`;
      panel.appendChild(n);
    }
  }

  // ✅ ALWAYS allow final answer reveal
  if (correct) {
    const a = document.createElement("div");
    a.className = "hint-card answer-card";
    a.textContent = `✅ Correct: ${game.current.name}`;
    panel.appendChild(a);
  }

  if (game.wrong >= 3 && !correct) {
    const a = document.createElement("div");
    a.className = "hint-card answer-card";
    a.textContent = `❌ Answer: ${game.current.name}`;
    panel.appendChild(a);
  }
}

/* END ROUND */

function endRound() {

  // record result BEFORE locking next round
  if (game.current) {
    game.roundHistory.push({
      player: game.current.name,
      result:
        game.wrong >= 3 ? "fail" :
        game.wrong === 0 ? "correct" :
        "partial"
    });
  }

  game.locked = true;

  document.getElementById("guessBtn").disabled = true;
  document.getElementById("giveUpBtn").disabled = true;
  document.getElementById("shareBtn").disabled = false;

  const nextBtn = document.getElementById("nextBtn");

  nextBtn.disabled = false;
  nextBtn.style.outline = "3px solid #22c55e";
  nextBtn.style.outlineOffset = "2px";

  updateUI();
}

/* AUTOCOMPLETE (CHANGED ONLY SOURCE) */

function updateSuggestions() {
game.suggestionIndex = -1;
game.suggestionItems = [];

  game.selectedSuggestion = false;

  const input =
    document.getElementById("guess").value.toLowerCase();

  const box = document.getElementById("suggestions");

  if (input.length < 3) {
    box.style.display = "none";
    return;
  }

  // ✅ CHANGED: now uses guessPool instead of players
  const matches =
  game.guessPool
    .filter(p =>
      p.toLowerCase().includes(input)
    )
    .slice(0, 8);

  box.innerHTML = "";
  matches.forEach(m => {

  const div = document.createElement("div");
  div.className = "suggestion";
  div.textContent = m;

  div.dataset.index = game.suggestionItems.length;

  game.suggestionItems.push(div);

  div.onclick = () => {
    document.getElementById("guess").value = m;
    game.selectedSuggestion = true;
    box.style.display = "none";
  };

  box.appendChild(div);
});

  box.style.display = matches.length ? "block" : "none";
}

function hideSuggestions() {
  document.getElementById("suggestions").style.display = "none";
}
function updateHighlight() {

  const items = game.suggestionItems;

  for (let i = 0; i < items.length; i++) {

    if (i === game.suggestionIndex) {
      items[i].style.background = "#1e293b";
      items[i].style.color = "white";

const box = document.getElementById("suggestions");

const item = items[i];

const itemTop = item.offsetTop;
const itemBottom = itemTop + item.offsetHeight;

const boxTop = box.scrollTop;
const boxBottom = boxTop + box.offsetHeight;

if (itemTop < boxTop) {
  box.scrollTop = itemTop;
}

if (itemBottom > boxBottom) {
  box.scrollTop = itemBottom - box.offsetHeight;
}

    } else {
      items[i].style.background = "";
      items[i].style.color = "";
    }
  }
}

/* SHARE */

function share() {

 const url =
`${window.location.origin}${window.location.pathname}?play=${game.playType}&mode=${game.mode}&date=${game.date}`;

  const text =
    game.lastOutcome === "win"
      ? "I got it! 🎾 Try this Slam Guesser challenge"
      : "I lost :( 🎾 Try this Slam Guesser challenge";

  if (navigator.share) {

    navigator.share({
      title: "🎾 Slam Guesser",
      text,
      url
    }).catch(() => {});

    return;
  }

  navigator.clipboard
    .writeText(`${text}\n\n${url}`)
    .then(() => {
      showMessage("📋 Copied!");
    });
}


/* CLASS MAP */

function cls(v) {

  if (!v) return "";

  if (v === "W") return "W";
  if (v === "F") return "F";
  if (v === "SF") return "SF";
  if (v === "QF") return "QF";

  if (v === "4R") return "R4";
  if (v === "3R") return "R3";
  if (v === "2R") return "R2";
  if (v === "1R") return "R1";

  if (v === "A") return "A";
  if (v === "NH") return "NH";

  if (v === "Q1") return "Q1";
  if (v === "Q2") return "Q2";
  if (v === "Q3") return "Q3";

  if (v.includes("Q")) return "Q";

  return "";
}

/* RENDER */

function render() {

  const p = game.current;

  const slams = Object.keys(p.slams || {});

  const years = [...new Set(
  slams.flatMap(s => Object.keys(p.slams?.[s] || {}))
)]
  .map(Number)
  .sort((a,b)=>a-b)
  .map(String);

// HARD MODE SHUFFLE

  let html = "<tr><th>Slam</th>";

 years.forEach(y => {

  const label =
    game.mode === "hard"
      ? "?"
      : y;

  html += `<th>${label}</th>`;
});

  html += "</tr>";

  for (const slam of slams) {

    html += `<tr><td class="slam">${slam}</td>`;

    for (const y of years) {

      const v = p.slams?.[slam]?.[y] || "";
      html += `<td class="${cls(v)}">${v}</td>`;
    }

    html += "</tr>";
  }

  document.getElementById("table").innerHTML = html;
}

/* UI */

function updateUI() {

  const wrongSpan = document.getElementById("wrong");
  const wrongBox = wrongSpan.parentElement;

  wrongSpan.textContent = game.wrong;

  // remove previous states
  wrongBox.classList.remove("wrong-1", "wrong-2", "wrong-3");

  // apply new state
  if (game.wrong === 1) {
    wrongBox.classList.add("wrong-1");
  }
  else if (game.wrong === 2) {
    wrongBox.classList.add("wrong-2");
  }
  else if (game.wrong >= 3) {
    wrongBox.classList.add("wrong-3");
  }
}

/* EVENTS */

document.getElementById("guess")
  .addEventListener("input", updateSuggestions);

document.getElementById("guess")
  .addEventListener("keydown", e => {

    const box = document.getElementById("suggestions");

    if (box.style.display === "block") {

      if (e.key === "ArrowDown") {
        e.preventDefault();
        game.suggestionIndex =
          Math.min(game.suggestionIndex + 1, game.suggestionItems.length - 1);

        updateHighlight();
      }

      else if (e.key === "ArrowUp") {
        e.preventDefault();
        game.suggestionIndex =
          Math.max(game.suggestionIndex - 1, 0);

        updateHighlight();
      }

      else if (e.key === "Enter") {

        if (game.suggestionIndex >= 0) {
          e.preventDefault();
          game.suggestionItems[game.suggestionIndex].click();
        } else {
          guess();
        }
      }

    } else {
      if (e.key === "Enter") guess();
    }
  });

document.addEventListener("click", e => {
  if (!e.target.closest(".controls")) {
    hideSuggestions();
  }
});

load();

</script>
